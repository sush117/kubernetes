apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: task-manager-ingress
  namespace: task-manager

  annotations:
    ingressClassName: "gce"
    kubernetes.io/ingress.global-static-ip-name: "task-manager-ip"


spec:
  defaultBackend:
    service:
      name: task-manager-backend-service
      port:
        number: 3000